name: Combined Cnix broker Override
desc: 合并多个分流规则

rule-providers:
  TikTok:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.yaml
    interval: 86400
  Spotify:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.yaml
    interval: 86400
  BiliBili:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/BiliBili/BiliBili.yaml
    interval: 86400
  DisneyPlus:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/liu294100/web-subscription-yaml/refs/heads/main/doc/rule/Disneyplus.yaml
    interval: 86400
  Steam:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.yaml
    interval: 86400
  HBO:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBO/HBO.yaml
    interval: 86400
  Broker:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/liu294100/pytoolkit/refs/heads/dev/zmihomoorule/Broker_Simple.yaml
    interval: 86400

proxy-groups:
- name: 🎬 TikTokRule
  type: select
  proxies:
  - "🔰 手动选择"
  - "🎯 Direct"
  - "🌍 主流媒体"
  include-all-proxies: true
  filter: .*
- name: 🎬 SpotifyRule
  type: select
  proxies:
  - "🔰 手动选择"
  - "🎯 Direct"
  - "🌍 主流媒体"
  include-all-proxies: true
  filter: .*
- name: 🎬 BiliBiliRule
  type: select
  proxies:
  - "🔰 手动选择"
  - "🎯 Direct"
  - "🌍 主流媒体"
  include-all-proxies: true
  filter: .*
- name: 🎬 DisneyPlusRule
  type: select
  proxies:
  - "🔰 手动选择"
  - "🎯 Direct"
  - "🌍 主流媒体"
  include-all-proxies: true
  filter: .*
- name: 🎬 SteamRule
  type: select
  proxies:
  - "🔰 手动选择"
  - "🎯 Direct"
  - "🌍 主流媒体"
  include-all-proxies: true
  filter: .*
- name: 🎬 HBORule
  type: select
  proxies:
  - "🔰 手动选择"
  - "🎯 Direct"
  - "🌍 主流媒体"
  include-all-proxies: true
  filter: .*
- name: 🌍 Broker
  type: select
  proxies:
  - "🔰 手动选择"
  - "🎯 Direct"
  - "🌍 主流媒体"
  include-all-proxies: true
  filter: .*

rules:
- RULE-SET,TikTok,🎬 TikTokRule
- RULE-SET,Spotify,🎬 SpotifyRule
- RULE-SET,BiliBili,🎬 BiliBiliRule
- RULE-SET,DisneyPlus,🎬 DisneyPlusRule
- RULE-SET,Steam,🎬 SteamRule
- RULE-SET,HBO,🎬 HBORule
- RULE-SET,Broker,🌍 Broker
